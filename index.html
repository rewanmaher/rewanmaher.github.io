<title>Rewan Maher | Connect</title>

<style>
:root{--bg:#FAF7F2;--card:#E3D5C3;--text:#3B2F2A;--muted:#6B5D55;--accent:#9A5A3C;--on-accent:#FFFFFF;--line:#CDBBA2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231C18;--card:#3A2F29;--text:#F3ECE3;--muted:#CBBDAE;--accent:#C98863;--on-accent:#231C18;--line:#54453C}}
:root[data-theme="dark"]{--bg:#231C18;--card:#3A2F29;--text:#F3ECE3;--muted:#CBBDAE;--accent:#C98863;--on-accent:#231C18;--line:#54453C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif;min-height:100vh}
main{max-width:440px;margin:0 auto;padding:40px 20px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}
.photo{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);display:block}
h1{font:500 30px 'Playfair Display',Georgia,serif;margin:18px 0 4px}
.role{margin:0;font-weight:600;font-size:15px}
.loc{margin:6px 0 0;color:var(--muted);font-size:13px}
.chip{margin:16px 0 0;padding:8px 14px;border-radius:999px;background:var(--card);font-size:13px;font-weight:600}
.svc{margin:18px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.links{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:12px}
.l{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 18px;border-radius:14px;background:var(--card);color:var(--text);text-decoration:none;font-weight:600;font-size:15px;border:1px solid var(--line);text-align:left}
.l.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.l:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.l svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.l .bd{width:22px;text-align:center;font-size:14px;flex:none}
.l small{margin-left:auto;font-weight:400;font-size:12px;opacity:.85}
footer{margin-top:30px;color:var(--muted);font-size:12px}
</style>
